name: CANDIDATE MMcrm integrated-main v2 preflight (inactive)

# INACTIVE TEMPLATE. Must be moved to .github/workflows/ only after independent review.
# Existing production v1 workflow remains unchanged.
on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: Pinned CRM integrated source ref
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: mmcrm-deployment-preflight-${{ inputs.app_ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && github.actor == 'RogerPazzagliniCeo8earn'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.4
        id: source-token
        with:
          app-id: ${{ vars.MMCRM_SOURCE_APP_ID }}
          private-key: ${{ secrets.MMCRM_SOURCE_APP_REFIVATE_KEY }}
          owner: RogerPazzagliniCeo8earn
          repositories: MegaMonitor,MMcrm-Infrastructure
          permission-contents: read
          permission-pull-requests: read
          permission-actions: read
          permission-statuses: read
          permission-checks: read
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: RogerPazzagliniCeo8earn/MMcrm-Infrastructure
          ref: 4d9202819a64e9d5823aae3b471d8531aee02be7
          token: ${{ steps.source-token.outputs.token }}
          path: private-controller
          sparse-checkout: |
            ops/updates/prepare-mmcrm-main-archive.py
            ops/updates/mmcrm-deploy-manifest.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify immutable integrated main commit, tree and successful push CI
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          APP_REF: ${{ inputs.app_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APP_REF" == main ]] || { echo 'Only integrated main is allowed.' >&2; exit 1; }
          repo='repos/RogerPazzagliniCeo8earn/MegaMonitor'
          gh api "$repo/branches/main" > "$RUNNER_TEMP/source-branch.json"
          gh api "$repo/commits/715a40139f2951f2e499b2169a05089ada3e214e" > "$RUNNER_TEMP/source-commit.json"
          gh api "$repo/commits/715a40139f2951f2e499b2169a05089ada3e214e/status" > "$RUNNER_TEMP/source-status.json"
          gh api --paginate --slurp "$repo/commits/715a40139f2951f2e499b2169a05089ada3e214e/check-runs?per_page=100" |
            jq '{total_count: ([.[].total_count] | add), check_runs: [.[].check_runs[]]}' > "$RUNNER_TEMP/source-checks.json"
          gh api "repos/RogerPazzagliniCeo8earn/MegaMonitor/actions/runs/42214127219" > "$RUNNER_TEMP/source-ci-run.json"
          python3 ops/broker/main_release_source.py --verify \
            "$RUNNER_TEMP/source-branch.json" "$RUNNER_TEMP/source-commit.json" \
            "$RUNNER_TEMP/source-status.json" "$RUNNER_TEMP/source-checks.json" \
            "$RUNNER_TEMP/source-ci-run.json"
      - name: Build the private CRM archive and obtain a server-side preflight challenge
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          SSH_PRIVATE_KEY: ${{ secrets.MMCRM_PREFLIGHT_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MMCRM_SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.MMCRM_DEPLOY_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/source-real.tar.gz"
          archive="$RUNNER_TEMP/source-crm-only.tar.gz"
          prepared="$RUNNER_TEMP/prepare.log"
          python3 ops/broker/fetch_source_main_v2.py "$raw"
          python3 private-controller/ops/updates/prepare-mmcrm-main-archive.py --prepare "$raw" "$archive" > "$prepared"
          # Normalize gzip header metadata (mtime/original filename) before hashing and signing.
          gzip -dc "$archive" | gzip -n -c > "$archive.normalized"
          mv "$archive.normalized" "$archive"
          content_sha=$(sed -n 's/.*content_sha256=\([0-9a-f]\{64\}\).*/\1/p' "$prepared")
          archive_sha=$(sha256sum "$archive" | awk '{print $1}')
          [[ "$content_sha" =~ ^[0-9a-f]{64}$ && "$archive_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" && -n "$DEPLOY_HOST" ]]
          umask 077
          ssh_dir="$RUNNER_TEMP/mmcrm-preflight-ssh"
          install -d -m 0700 "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          out="$RUNNER_TEMP/preflight-challenge.out"
          ssh_err="$RUNNER_TEMP/preflight.err"
          if printf 'challenge %s %s %s %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$content_sha" "$archive_sha" |
            ssh -T -i "$ssh_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
              "mmcrm-deploy@$DEPLOY_HOST" > "$out" 2> "$ssh_err"; then
            :
          else
            ssh_rc=$?
            python3 ops/broker/ssh_diagnostic.py "$ssh_err" "$ssh_rc" "$out" >&2 || true
            exit "$ssh_rc"
          fi
          grep -Fxq 'UPGRADE_PREFLIGHT_OK source=df195e6da70206bdd2e690507558a63eaa3705e5 target=715a40139f2951f2e499b2169a05089ada3e214e service=active bind=loopback database=present config=preserved' "$out" || {
            echo 'Expected read-only preflight marker was not returned.' >&2; exit 1;
          }
          tail -n 1 "$out" > "$RUNNER_TEMP/deployment-manifest.json"
          python3 ops/broker/main_release_gate_v2.py --manifest "$RUNNER_TEMP/deployment-manifest.json" "$GITHUB_RUN_ID" "$GITHUB_SHA"
          python3 - "$RUNNER_TEMP/deployment-manifest.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1],encoding="utf-8"))
          print("## MMcrm signed approval request\n")
          print(f"- Preflight run: `{m['preflight_run_id']}`")
          print(f"- Broker commit: `{m['broker_sha']}`")
          print(f"- Source ref: `{m['app_ref']}`; previous installed commit: `{m['old_commit']}`")
          print(f"- Application commit: `{m['app_commit']}`")
          print(f"- Application tree: `{m['app_tree']}`")
          print(f"- VPS read-only preflight SHA-256: `{m['preflight_sha256']}`")
          print(f"- CRM-only content SHA-256: `{m['content_sha256']}`")
          print(f"- CRM-only archive SHA-256: `{m['archive_sha256']}`")
          print(f"- Authorization challenge expires: `{m['expires_at']}` (Unix time)")
          print("\nDownload the challenge artifact and sign it locally. The archive is not uploaded.")
          PY
          rm -f "$raw" "$archive" "$prepared" "$ssh_dir/key" "$ssh_dir/known_hosts" "$RUNNER_TEMP/preflight.err"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mmcrm-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/deployment-manifest.json
          if-no-files-found: error
          retention-days: 2
